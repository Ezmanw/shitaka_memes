name: Build Windows & macOS

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath shitaka-memes-windows-x64.zip
      - name: Upload to release (tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: shitaka-memes-windows-x64.zip
          tag_name: ${{ github.ref_name }}
      - name: Upload artifact (push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: shitaka-memes-windows-x64
          path: shitaka-memes-windows-x64.zip
          retention-days: 7

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package .app
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent "Shitaka Memes.app" "${{ runner.temp }}/shitaka-memes-macos.zip"
      - name: Upload to release (tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/shitaka-memes-macos.zip
          tag_name: ${{ github.ref_name }}
      - name: Upload artifact (push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: shitaka-memes-macos
          path: ${{ runner.temp }}/shitaka-memes-macos.zip
          retention-days: 7