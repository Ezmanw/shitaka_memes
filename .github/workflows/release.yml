name: Build Windows, macOS & Linux

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Prepare APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk shitaka-memes-android.apk
      - name: Upload to release (tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: shitaka-memes-android.apk
          tag_name: ${{ github.ref_name }}
      - name: Upload artifact (push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: shitaka-memes-android
          path: shitaka-memes-android.apk
          retention-days: 7

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux deps
        run: |
          sudo apt-get update && sudo apt-get install -y clang cmake ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package bundle
        run: |
          tar -C build/linux/x64/release/bundle -czf shitaka-memes-linux-x64.tar.gz shitaka_memes lib data
      - name: Upload to release (tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: shitaka-memes-linux-x64.tar.gz
          tag_name: ${{ github.ref_name }}
      - name: Upload artifact (push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: shitaka-memes-linux-x64
          path: shitaka-memes-linux-x64.tar.gz
          retention-days: 7

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Download & Bundle FFmpeg & yt-dlp
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-dist"
          $ffmpegExe = Get-ChildItem -Path "ffmpeg-dist" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path "ffmpeg-dist" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item -Path $ffmpegExe.FullName -Destination "build/windows/x64/runner/Release/"
          Copy-Item -Path $ffprobeExe.FullName -Destination "build/windows/x64/runner/Release/"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "build/windows/x64/runner/Release/yt-dlp.exe"
      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath shitaka-memes-windows-x64.zip
      - name: Build Windows Installer
        shell: pwsh
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer.iss
      - name: Upload to release (tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shitaka-memes-windows-x64.zip
            build/windows/installer/shitaka-memes-windows-setup.exe
          tag_name: ${{ github.ref_name }}
      - name: Upload artifact (push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: shitaka-memes-windows-x64
          path: |
            shitaka-memes-windows-x64.zip
            build/windows/installer/shitaka-memes-windows-setup.exe
          retention-days: 7

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package .app
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -type d | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "${{ runner.temp }}/shitaka-memes-macos.zip"
      - name: Upload to release (tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/shitaka-memes-macos.zip
          tag_name: ${{ github.ref_name }}
      - name: Upload artifact (push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: shitaka-memes-macos
          path: ${{ runner.temp }}/shitaka-memes-macos.zip
          retention-days: 7