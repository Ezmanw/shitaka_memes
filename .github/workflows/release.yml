name: Build Windows, macOS & Linux

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Prepare APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk shitaka-memes-android.apk
      - name: Upload to release (tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: shitaka-memes-android.apk
          tag_name: ${{ github.ref_name }}
      - name: Upload artifact (push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: shitaka-memes-android
          path: shitaka-memes-android.apk
          retention-days: 7

  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            deb_arch: amd64
          - arch: arm64
            deb_arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies & packaging tools
        run: |
          sudo apt-get update && sudo apt-get install -y \
            clang cmake ninja-build libgtk-3-dev dpkg-dev rpm alien zstd || true
      - run: flutter pub get
      - name: Set up QEMU for ARM64 cross-compilation
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Build Flutter Linux app
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu || true
            export CFLAGS="-march=armv8-a -mcpu=cortex-a57 -mtune=cortex-a57"
            export CXXFLAGS="-march=armv8-a -mcpu=cortex-a57 -mtune=cortex-a57"
            flutter build linux --release || true
          else
            flutter build linux --release
          fi

      - name: Package Tarball & Include install.sh
        run: |
          BUNDLE_DIR=$(find build/linux -name bundle -type d | head -1 || echo "build/linux/x64/release/bundle")
          if [ -d "$BUNDLE_DIR" ]; then
            cp tool/install.sh $BUNDLE_DIR/install.sh || true
            chmod +x $BUNDLE_DIR/install.sh || true
            tar -C $BUNDLE_DIR -czf shitaka-memes-linux-${{ matrix.arch }}.tar.gz . || true
          fi

      - name: Build .deb Debian Package
        run: |
          BUNDLE_DIR=$(find build/linux -name bundle -type d | head -1 || echo "build/linux/x64/release/bundle")
          if [ -d "$BUNDLE_DIR" ]; then
            DEB_DIR="build/deb_pkg"
            mkdir -p $DEB_DIR/DEBIAN $DEB_DIR/usr/lib/shitaka_memes $DEB_DIR/usr/bin $DEB_DIR/usr/share/applications
            cp -r $BUNDLE_DIR/* $DEB_DIR/usr/lib/shitaka_memes/ || true
            ln -sf /usr/lib/shitaka_memes/shitaka_memes $DEB_DIR/usr/bin/shitaka_memes || true

            cat <<'EOF' > $DEB_DIR/DEBIAN/control
Package: shitaka-memes
Version: 1.2.0
Section: utils
Priority: optional
Architecture: ${{ matrix.deb_arch }}
Maintainer: Ethan <shitaka@example.com>
Description: High-speed cross-platform meme compression utility.
EOF

            cat <<'EOF' > $DEB_DIR/usr/share/applications/shitaka-memes.desktop
[Desktop Entry]
Name=Shitaka Memes
Comment=High-speed cross-platform meme compression utility
Exec=/usr/bin/shitaka_memes
Icon=shitaka-memes
Terminal=false
Type=Application
Categories=Utility;Multimedia;
EOF

            dpkg-deb --build $DEB_DIR shitaka-memes-linux-${{ matrix.arch }}.deb || true
          fi

      - name: Build .rpm Package
        run: |
          if [ -f shitaka-memes-linux-${{ matrix.arch }}.deb ]; then
            alien -r -k shitaka-memes-linux-${{ matrix.arch }}.deb || true
            mv *.rpm shitaka-memes-linux-${{ matrix.arch }}.rpm || true
          fi

      - name: Build Arch Linux package (.pkg.tar.zst)
        run: |
          BUNDLE_DIR=$(find build/linux -name bundle -type d | head -1 || echo "build/linux/x64/release/bundle")
          if [ -d "$BUNDLE_DIR" ]; then
            ARCH_DIR="build/arch_pkg"
            mkdir -p $ARCH_DIR/usr/bin $ARCH_DIR/usr/lib/shitaka_memes
            cp -r $BUNDLE_DIR/* $ARCH_DIR/usr/lib/shitaka_memes/ || true
            ln -sf /usr/lib/shitaka_memes/shitaka_memes $ARCH_DIR/usr/bin/shitaka_memes || true
            tar -C $ARCH_DIR -I 'zstd' -cf shitaka-memes-linux-${{ matrix.arch }}.pkg.tar.zst . || true
          fi

      - name: Upload to release (tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shitaka-memes-linux-${{ matrix.arch }}.tar.gz
            shitaka-memes-linux-${{ matrix.arch }}.deb
            shitaka-memes-linux-${{ matrix.arch }}.rpm
            shitaka-memes-linux-${{ matrix.arch }}.pkg.tar.zst
            tool/install.sh
          tag_name: ${{ github.ref_name }}
      - name: Upload artifact (push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: shitaka-memes-linux-${{ matrix.arch }}
          path: |
            shitaka-memes-linux-${{ matrix.arch }}.tar.gz
            shitaka-memes-linux-${{ matrix.arch }}.deb
            shitaka-memes-linux-${{ matrix.arch }}.rpm
            shitaka-memes-linux-${{ matrix.arch }}.pkg.tar.zst
            tool/install.sh
          retention-days: 7

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Download & Bundle FFmpeg & yt-dlp
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg-dist"
          $ffmpegExe = Get-ChildItem -Path "ffmpeg-dist" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path "ffmpeg-dist" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item -Path $ffmpegExe.FullName -Destination "build/windows/x64/runner/Release/"
          Copy-Item -Path $ffprobeExe.FullName -Destination "build/windows/x64/runner/Release/"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "build/windows/x64/runner/Release/yt-dlp.exe"
      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath shitaka-memes-windows-x64.zip
      - name: Build Windows Installer
        shell: pwsh
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer.iss
      - name: Upload to release (tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shitaka-memes-windows-x64.zip
            build/windows/installer/shitaka-memes-windows-setup.exe
          tag_name: ${{ github.ref_name }}
      - name: Upload artifact (push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: shitaka-memes-windows-x64
          path: |
            shitaka-memes-windows-x64.zip
            build/windows/installer/shitaka-memes-windows-setup.exe
          retention-days: 7

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package .app
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -type d | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "${{ runner.temp }}/shitaka-memes-macos.zip"
      - name: Upload to release (tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/shitaka-memes-macos.zip
          tag_name: ${{ github.ref_name }}
      - name: Upload artifact (push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: shitaka-memes-macos
          path: ${{ runner.temp }}/shitaka-memes-macos.zip
          retention-days: 7